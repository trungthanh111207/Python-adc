<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Minh họa Central Limit Theorem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;

            align-items: center;

            height: 100vh;
            margin: 0;
        }
        h2 {

        }

        </video>
